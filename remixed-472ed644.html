*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext}=React;

/* ═══════════════════════════════════════════
   AUTH STORE — all state persisted in localStorage
═══════════════════════════════════════════ */
const LS = {
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem(k)}catch{}},
};

const SEED_USERS=[
  {id:'u1',name:'Alex Chen',email:'alex@acme.io',password:'password123',avatar:'AC',company:'Acme Corp',plan:'Growth',joined:'Jan 2026',provider:'email'},
  {id:'u2',name:'Demo User',email:'demo@apexverse.ai',password:'demo1234',avatar:'DU',company:'Apexverse',plan:'Professional',joined:'Mar 2026',provider:'email'},
];
function getUsersDB(){return LS.get('apx_users')||SEED_USERS;}
function saveUsersDB(users){LS.set('apx_users',users);}
function initUsersDB(){if(!LS.get('apx_users'))saveUsersDB(SEED_USERS);}
initUsersDB();

function getSession(){return LS.get('apx_session');}
function saveSession(user){const s={...user,sessionAt:Date.now()};LS.set('apx_session',s);return s;}
function clearSession(){LS.del('apx_session');}

function getProjects(userId){return LS.get(`apx_proj_${userId}`)||DEFAULT_PROJECTS;}
function saveProjects(userId,projects){LS.set(`apx_proj_${userId}`,projects);}
function getNotifs(userId){return LS.get(`apx_notifs_${userId}`)||DEFAULT_NOTIFS;}
function saveNotifs(userId,notifs){LS.set(`apx_notifs_${userId}`,notifs);}

  {id:'p1',name:'Acme Docs',domain:'docs.acme.io',status:'active',pages:1842,lastRun:'2h ago',created:'Jan 12, 2026'},

  plus:'M12 5v14M5 12h14',minus:'M5 12h14','chevron-down':'M6 9l6 6 6-6',
  'chevron-right':'M9 18l6-6-6-6','chevron-left':'M15 18l-6-6 6-6',
  'arrow-right':'M5 12h14M12 5l7 7-7 7',

/* ═══════════════════════════════════════════ TOAST ═ */
const TC=createContext(null);
const ToastProvider=({children})=>{
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type='success')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,t:type}]);
    setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),3400);
  },[]);
  const icons={success:'check-circle',error:'alert-circle',warning:'alert-triangle',info:'info'};
  const colors={success:'var(--green)',error:'var(--red)',warning:'var(--yellow)',info:'var(--blue)'};
  return(
    <TC.Provider value={show}>
      {children}
      <div className="tc">
        {toasts.map(t=>(
          <div key={t.id} className={`toast tt${t.t[0]}`}>
            <I n={icons[t.t]} s={16} c={colors[t.t]}/>
            <span style={{fontSize:14,color:'var(--text)',flex:1}}>{t.msg}</span>
            <button onClick={()=>setToasts(p=>p.filter(x=>x.id!==t.id))} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',padding:0}}><I n="x" s={13}/></button>
          </div>
        ))}
      </div>
    </TC.Provider>
  );
};
const useToast=()=>useContext(TC);

/* ═══════════════════════════════════════ AUTH CTX ═ */
const AC=createContext(null);
const AuthProvider=({children})=>{
  const [user,setUser]=useState(null);
  const [ready,setReady]=useState(false);
  useEffect(()=>{
    const s=getSession();
    if(s&&s.sessionAt&&Date.now()-s.sessionAt<7*24*3600*1000)setUser(s);
    setReady(true);
  },[]);
  const login=(u)=>{const s=saveSession(u);setUser(s);};
  const logout=()=>{clearSession();setUser(null);};
  const updateUser=(changes)=>{
    const updated={...user,...changes};
    saveSession(updated);setUser(updated);
    const users=getUsersDB();
    saveUsersDB(users.map(u=>u.id===updated.id?{...u,...changes}:u));
  };
  return <AC.Provider value={{user,ready,login,logout,updateUser}}>{children}</AC.Provider>;
};
const useAuth=()=>useContext(AC);

/* ═══════════════════════════════════════ AUTH PAGE ═ */
const AuthPage=({mode,setPage})=>{
  const {login}=useAuth();
  const toast=useToast();
  const [form,setForm]=useState({name:'',email:'',password:'',confirm:'',terms:false});
  const [errs,setErrs]=useState({});
  const [loading,setLoading]=useState(false);
  const [showP,setShowP]=useState(false);
  const [done,setDone]=useState(false);
  const [googleOpen,setGoogleOpen]=useState(false);

  const validate=()=>{
    const e={};
    if(mode==='signup'&&!form.name.trim())e.name='Required';
    if(!form.email||!/\S+@\S+\.\S+/.test(form.email))e.email='Valid email required';
    if(mode!=='forgot'&&!form.password)e.password='Required';
    if(mode==='signup'&&form.password.length<8)e.password='Min 8 characters';
    if(mode==='signup'&&form.password!==form.confirm)e.confirm='Passwords do not match';
    if(mode==='signup'&&!form.terms)e.terms='Please accept terms';
    return e;
  };

  const handleSubmit=()=>{
    const e=validate();setErrs(e);
    if(Object.keys(e).length)return;
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      if(mode==='forgot'){setDone(true);return;}
      if(mode==='signup'){
        const users=getUsersDB();
        if(users.find(u=>u.email===form.email)){setErrs({email:'Email already registered'});return;}
        const newUser={id:'u_'+Date.now(),name:form.name,email:form.email,password:form.password,avatar:form.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2),company:'',plan:'Starter',joined:'Mar 2026',provider:'email'};
        saveUsersDB([...users,newUser]);
        login(newUser);toast('Account created! Welcome.','success');setPage('dashboard');return;
      }
      const users=getUsersDB();
      const found=users.find(u=>u.email===form.email&&u.password===form.password&&u.provider==='email');
      if(!found){setErrs({password:'Invalid email or password'});return;}
      login(found);toast(`Welcome back, ${found.name.split(' ')[0]}!`,'success');setPage('dashboard');
    },900);
  };

  const handleGoogle=(acc)=>{
    setGoogleOpen(false);
    const users=getUsersDB();
    let gUser=users.find(u=>u.googleSub===acc.sub);
    if(!gUser){
      gUser={id:'g_'+Date.now(),name:acc.name,email:acc.email,password:'',avatar:acc.avatar,company:'',plan:'Starter',joined:'Mar 2026',provider:'google',googleSub:acc.sub};
      saveUsersDB([...users,gUser]);
    }
    login(gUser);toast(`Signed in as ${gUser.name.split(' ')[0]}`,'success');setPage('dashboard');
  };

  if(done)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:20}}>
      <div style={{textAlign:'center',maxWidth:360}}>
        <div style={{width:60,height:60,background:'var(--green-bg)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}><I n="mail" s={26} c="var(--green)"/></div>
        <h2 style={{fontSize:22,fontFamily:'var(--ffd)',marginBottom:7}}>Check your email</h2>
        <p style={{fontSize:14,color:'var(--text3)',marginBottom:20}}>Reset link sent to <strong>{form.email}</strong></p>
        <button className="btn bp" onClick={()=>setPage('login')}>Back to login</button>
      </div>
    </div>
  );

  const titles={login:'Welcome back',signup:'Create your account',forgot:'Reset password'};
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:'36px 20px'}}>
      {googleOpen&&<GoogleOAuth onSuccess={handleGoogle} onClose={()=>setGoogleOpen(false)}/>}
      <div style={{width:'100%',maxWidth:400}}>
        <button onClick={()=>setPage('home')} style={{background:'none',border:'none',cursor:'pointer',marginBottom:28,padding:0}}><Logo/></button>
        <h1 style={{fontSize:24,fontFamily:'var(--ffd)',fontWeight:800,marginBottom:4}}>{titles[mode]}</h1>

const ProjectsPage=({setPage})=>{

/* ═══════════════════════ CREATE PROJECT WIZARD ═ */
const CreateProject=({setPage})=>{
  const {user}=useAuth();
  const toast=useToast();
  const [step,setStep]=useState(1);
  const [form,setForm]=useState({name:'',url:'',depth:3,maxPages:1000,jsRender:false,outputs:['json','markdown'],dest:'download'});
  const [errs,setErrs]=useState({});
  const [launching,setLaunching]=useState(false);
  const [launched,setLaunched]=useState(false);
  const up=(k,v)=>setForm(f=>({...f,[k]:v}));
  const toggleOut=fmt=>up('outputs',form.outputs.includes(fmt)?form.outputs.filter(x=>x!==fmt):[...form.outputs,fmt]);
  const steps=['Project','Crawl','Output','Destination','Review'];
  const validateStep=()=>{
    if(step===1){const e={};if(!form.name.trim())e.name='Required';if(!form.url.trim())e.url='Required';if(form.url&&!form.url.startsWith('http'))e.url='Must start with http://';setErrs(e);return Object.keys(e).length===0;}
    return true;
  };
  if(launched)return(
    <div style={{minHeight:'60vh',display:'flex',alignItems:'center',justifyContent:'center',padding:40,flexDirection:'column',textAlign:'center'}}>
      <div style={{width:64,height:64,background:'var(--green-bg)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px',animation:'float 2s ease-in-out infinite'}}><I n="check-circle" s={28} c="var(--green)"/></div>
      <h2 style={{fontSize:22,fontFamily:'var(--ffd)',marginBottom:8}}>Crawl started!</h2>
      <p style={{fontSize:14,color:'var(--text3)',maxWidth:340,marginBottom:24,lineHeight:1.65}}><strong>{form.name}</strong> is now crawling.</p>
      <div className="fxc" style={{gap:10}}><button className="btn bp" onClick={()=>setPage('projects')}>View projects</button><button className="btn bs" onClick={()=>setPage('dashboard')}>Dashboard</button></div>
    </div>
  );
  return(
    <div>
      <TopBar title="Create project" sub="New extraction pipeline" setPage={setPage}/>
      <div className="pc ai">
        <div style={{maxWidth:580,margin:'0 auto'}}>
          <div className="fxc" style={{marginBottom:28}}>
            {steps.map((l,i)=>(
              <React.Fragment key={l}>
                <div className="fxc" style={{flexDirection:'column',gap:4}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:i+1<=step?'var(--accent)':'var(--bg3)',color:i+1<=step?'white':'var(--text3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:600,boxShadow:i+1===step?'0 0 0 4px rgba(24,23,15,.1)':'none'}}>
                    {i+1<step?<I n="check" s={12} c="white"/>:i+1}
                  </div>
                  <span style={{fontSize:9,color:i+1<=step?'var(--text2)':'var(--text4)',fontWeight:500,whiteSpace:'nowrap'}}>{l}</span>
                </div>
                {i<steps.length-1&&<div style={{flex:1,height:1,background:i+1<step?'var(--accent)':'var(--border)',margin:'0 6px',marginBottom:14}}/>}
              </React.Fragment>

const Team=({setPage})=>{

  const [members,setMembers]=useState(initTeam);
  const [invOpen,setInvOpen]=useState(false);
  const [invEmail,setInvEmail]=useState('');
  const [invRole,setInvRole]=useState('Member');
  const invite=()=>{
    if(!invEmail)return;
    if(members.find(m=>m.email===invEmail)){toast('Already in team','error');return;}
    const nm={id:'tm_'+Date.now(),name:invEmail.split('@')[0],email:invEmail,role:invRole,av:invEmail[0].toUpperCase(),joined:'Mar 2026',isYou:false};

    <div>
      <TopBar title="Team" sub={`${members.length} members`} setPage={setPage} actions={<button className="btn bp bsm" onClick={()=>setInvOpen(true)}><I n="plus" s={13} c="white"/>Invite</button>}/>

const Settings=({setPage})=>{
  const {user,updateUser,logout}=useAuth();
  const toast=useToast();
  const [tab,setTab]=useState('profile');
  const [form,setForm]=useState({name:user?.name||'',email:user?.email||'',company:user?.company||''});
  const [pwForm,setPwForm]=useState({current:'',newP:'',confirm:''});
  const [pwErr,setPwErr]=useState('');
  const [notifs,setNotifs]=useState({crawlComplete:true,failures:true,billing:true,product:false});
  const [delConf,setDelConf]=useState('');
  const saveProfile=()=>{
    if(!form.name.trim()){toast('Name required','error');return;}
    updateUser({name:form.name,company:form.company,avatar:form.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)});
    toast('Profile saved!','success');
  };
  const changePassword=()=>{
    setPwErr('');
    const users=getUsersDB();const u=users.find(x=>x.id===user.id);
    if(u?.password!==pwForm.current){setPwErr('Current password is incorrect');return;}
    if(pwForm.newP.length<8){setPwErr('Min 8 characters');return;}
    if(pwForm.newP!==pwForm.confirm){setPwErr('Passwords do not match');return;}
    saveUsersDB(users.map(x=>x.id===user.id?{...x,password:pwForm.newP}:x));
    setPwForm({current:'',newP:'',confirm:''});toast('Password updated!','success');
  };
  const deleteAccount=()=>{
    if(delConf!=='DELETE'){toast('Type DELETE to confirm','error');return;}
    saveUsersDB(getUsersDB().filter(u=>u.id!==user.id));

        {tab==='security'&&(<div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:480}}>
          {user?.provider==='google'?(<div className="alert aii"><I n="info" s={16} c="var(--blue)"/><span>Your account uses Google Sign-In. Password management is handled by Google.</span></div>):(<div className="card"><h3 style={{fontSize:13,marginBottom:13}}>Change password</h3>{pwErr&&<div className="alert aei mb3" style={{padding:'8px 12px',fontSize:13}}><I n="alert-circle" s={14} c="var(--red)"/>{pwErr}</div>}<div style={{display:'flex',flexDirection:'column',gap:11}}><div className="fg"><label className="fl">Current password</label><input className="fi" type="password" value={pwForm.current} onChange={e=>setPwForm({...pwForm,current:e.target.value})}/></div><div className="fg"><label className="fl">New password</label><input className="fi" type="password" value={pwForm.newP} onChange={e=>setPwForm({...pwForm,newP:e.target.value})}/></div><div className="fg"><label className="fl">Confirm new</label><input className="fi" type="password" value={pwForm.confirm} onChange={e=>setPwForm({...pwForm,confirm:e.target.value})}/></div><button className="btn bp" style={{alignSelf:'flex-start'}} onClick={changePassword}>Update password</button></div></div>)}
          <div className="card" style={{border:'1px solid rgba(192,57,43,.2)'}}><h3 style={{fontSize:13,color:'var(--red)',marginBottom:6}}>Danger zone</h3><p style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>Permanently delete your account.</p><div className="fg mb3"><label className="fl">Type <strong>DELETE</strong> to confirm</label><input className="fi" value={delConf} onChange={e=>setDelConf(e.target.value)} placeholder="DELETE"/></div><button className="btn bdn" onClick={deleteAccount}>Delete my account</button></div>
        </div>)}
        {tab==='notifications'&&(<div className="card" style={{maxWidth:480}}><h3 style={{fontSize:13,marginBottom:16}}>Email notifications</h3>{[['crawlComplete','Crawl completed','Notify when extraction finishes'],['failures','Crawl failures','Alerts on errors'],['billing','Billing alerts','Invoices and limits'],['product','Product updates','New features']].map(([k,l,d])=>(<div key={k} className="fxb" style={{padding:'12px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontSize:13,fontWeight:500}}>{l}</div><div style={{fontSize:11,color:'var(--text3)'}}>{d}</div></div><label className="tog"><input type="checkbox" checked={notifs[k]} onChange={e=>{const u={...notifs,[k]:e.target.checked};setNotifs(u);toast(`Notifications ${e.target.checked?'enabled':'disabled'}`,'info');}}/><span className="tsl"/></label></div>))}</div>)}
      </div>
    </div>
  );
};

/* ════════════════════════════════════ SUPPORT/DOCS ═ */
const Support=({setPage})=>{

  const toast=useToast();
  return(
    <div>
      <TopBar title="Support" setPage={setPage}/>
      <div className="pc ai" style={{maxWidth:600}}>
        {sent?(<div className="alert asi mb4"><I n="check-circle" s={16} c="var(--green)"/><span>Ticket submitted! Ref <strong>#T-{Math.floor(Math.random()*9000)+1000}</strong>. We'll respond within 24h.</span></div>):(
          <div className="card mb4"><h3 style={{fontSize:13,marginBottom:13}}>Contact support</h3><div style={{display:'flex',flexDirection:'column',gap:12}}><div className="fg"><label className="fl">Subject</label><input className="fi" placeholder="Describe your issue" value={form.subject} onChange={e=>setForm({...form,subject:e.target.value})}/></div><div className="fg"><label className="fl">Priority</label><select className="fse" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div className="fg"><label className="fl">Message</label><textarea className="fta" placeholder="Describe in detail..." value={form.message} onChange={e=>setForm({...form,message:e.target.value})} style={{minHeight:120}}/></div><button className="btn bp" style={{alignSelf:'flex-start'}} onClick={()=>{if(!form.subject){toast('Subject required','error');return;}setSent(true);toast('Ticket submitted!','success');}}>Submit ticket</button></div></div>
        )}

};

      <div className="sec" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}>
        {[{ico:'globe',t:'Full-Site Crawling',d:'Discover and crawl every page automatically.'},{ico:'layers',t:'Smart Chunking',d:'RAG-ready chunks with configurable overlap.'},{ico:'code',t:'Structured Outputs',d:'JSON, JSONL, Markdown, CSV for any AI pipeline.'},{ico:'database',t:'Vector DB Delivery',d:'Push to Pinecone, Qdrant, Weaviate and more.'}].map(f=>(<div key={f.t} className="card ch"><div style={{width:38,height:38,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:13}}><I n={f.ico} s={17} c="var(--text2)"/></div><h3 style={{fontSize:13,marginBottom:6}}>{f.t}</h3><p style={{fontSize:12,color:'var(--text3)',lineHeight:1.6}}>{f.d}</p></div>))}

        <div className="fxc" style={{justifyContent:'center',gap:11,flexWrap:'wrap'}}>
          <button className="btn bxl" style={{background:'white',color:'var(--accent)'}} onClick={()=>setPage('signup')}>Get started free <I n="arrow-right" s={15} c="var(--accent)"/></button>
          <button className="btn bxl" style={{background:'rgba(255,255,255,.1)',color:'white',border:'1px solid rgba(255,255,255,.2)'}} onClick={()=>setPage('pricing')}>View pricing</button>

          {name:'Growth',mo:129,feat:['50,000 pages/month','10 projects','All output formats','Scheduled crawls','Priority support'],popular:true,cta:'Get started'},
          {name:'Enterprise',mo:null,feat:['Custom page volume','Unlimited projects','Dedicated infra','SSO & SAML','SLA guarantee'],popular:false,cta:'Talk to sales'}].map(plan=>(

            <h3 style={{fontSize:15,fontFamily:'var(--ffd)',marginBottom:8}}>{plan.name}</h3>

            <button className={`btn bfw mb4 ${plan.popular?'bbr':'bp'}`} style={{justifyContent:'center'}} onClick={()=>plan.mo?setPage('signup'):setPage('contact')}>{plan.cta}</button>

const EnterprisePage=({setPage})=>(
  <div className="ai">
    <div style={{padding:'84px 24px 60px',background:'var(--accent)',textAlign:'center'}}><h1 style={{fontSize:'clamp(28px,5vw,50px)',color:'white',fontFamily:'var(--ffd)',fontWeight:800,marginBottom:13}}>Enterprise AI infrastructure</h1><p style={{fontSize:16,color:'rgba(255,255,255,.5)',lineHeight:1.65,marginBottom:34}}>Private deployments, custom SLAs, and comprehensive governance.</p><button className="btn bxl" style={{background:'white',color:'var(--accent)'}} onClick={()=>setPage('contact')}>Book enterprise demo</button></div>
    <div style={{maxWidth:900,margin:'0 auto',padding:'60px 24px'}}>
      <div className="g3">{[['shield','SOC 2 Type II','Annual third-party security audits'],['lock','AES-256 Encryption','At rest and in transit'],['key','SSO & SAML','Okta, Azure AD, Google Workspace'],['users','RBAC','Granular permission controls'],['database','Private Deployment','Your own cloud infra'],['activity','Audit Logging','Complete action trail']].map(([ico,t,d])=>(<div key={t} className="card"><div style={{width:38,height:38,background:'var(--bg2)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:11}}><I n={ico} s={17} c="var(--text2)"/></div><h3 style={{fontSize:14,marginBottom:6}}>{t}</h3><p style={{fontSize:12,color:'var(--text3)',lineHeight:1.65}}>{d}</p></div>))}</div>
    </div>
    <Footer setPage={setPage}/>
  </div>
);
const ContactPage=({setPage})=>{
  const [sent,setSent]=useState(false);const [form,setForm]=useState({name:'',email:'',message:''});const toast=useToast();
  if(sent)return <div style={{minHeight:'60vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{textAlign:'center'}}><div style={{width:64,height:64,background:'var(--green-bg)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}><I n="check-circle" s={28} c="var(--green)"/></div><h2 style={{fontSize:22,fontFamily:'var(--ffd)'}}>Message received!</h2></div></div>;
  return(<div style={{maxWidth:560,margin:'0 auto',padding:'64px 24px'}} className="ai"><div className="stag">Contact</div><h1 style={{fontSize:28,fontFamily:'var(--ffd)',marginBottom:22}}>Talk to our team</h1><div style={{display:'flex',flexDirection:'column',gap:13}}><div className="fg"><label className="fl">Full name</label><input className="fi" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div><div className="fg"><label className="fl">Work email</label><input className="fi" type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></div><div className="fg"><label className="fl">Message</label><textarea className="fta" value={form.message} onChange={e=>setForm({...form,message:e.target.value})}/></div><button className="btn bp blg" onClick={()=>{if(!form.email){toast('Email required','error');return;}setSent(true);toast('Message sent!','success');}}>Send message <I n="send" s={14} c="white"/></button></div></div>);
};

/* ═══════════════════════════════════════════ APP ═ */
const App=()=>{
  const {user,ready}=useAuth();
  const [page,setPage]=useState('home');
  const goPage=useCallback((p)=>{setPage(p);window.scrollTo(0,0);},[]);

  useEffect(()=>{
    if(!ready)return;
    if(user){
      const last=LS.get('apx_last_page');
      const appPages=['dashboard','projects','create-project','project-detail','analytics','billing','team','settings','support','docs','notifications'];
      if(last&&appPages.includes(last))setPage(last);
      else setPage('dashboard');
    }
  },[ready,user]);

  useEffect(()=>{
    const appPages=['dashboard','projects','create-project','project-detail','analytics','billing','team','settings','support','docs','notifications'];
    if(appPages.includes(page))LS.set('apx_last_page',page);
  },[page]);

  if(!ready)return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><Spin s={28}/></div>;

  const publicPages=['home','features','pricing','enterprise','contact','docs'];
  const authPages=['login','signup','forgot'];
  const appPages=['dashboard','projects','create-project','project-detail','analytics','billing','team','settings','support','notifications'];
  const isApp=appPages.includes(page)||(![...publicPages,...authPages].includes(page)&&!!user);

  if(isApp&&!user){goPage('login');return null;}

  return(
    <>
      {authPages.includes(page)&&<AuthPage mode={page} setPage={goPage}/>}
      {publicPages.includes(page)&&(
        <div>
          <PubNav page={page} setPage={goPage}/>
          {page==='home'&&<HomePage setPage={goPage}/>}
          {page==='pricing'&&<PricingPage setPage={goPage}/>}
          {page==='enterprise'&&<EnterprisePage setPage={goPage}/>}
          {page==='contact'&&<ContactPage setPage={goPage}/>}
          {page==='docs'&&<Docs setPage={goPage}/>}
          {page==='features'&&<HomePage setPage={goPage}/>}
        </div>
      )}
      {isApp&&user&&(
        <div className="app">
          <Sidebar page={page} setPage={goPage}/>
          <div className="mc2">
            {page==='dashboard'&&<Dashboard setPage={goPage}/>}
            {page==='projects'&&<ProjectsPage setPage={goPage}/>}
            {page==='create-project'&&<CreateProject setPage={goPage}/>}
            {page==='project-detail'&&<ProjectDetail setPage={goPage}/>}
            {page==='analytics'&&<Analytics setPage={goPage}/>}
            {page==='billing'&&<Billing setPage={goPage}/>}
            {page==='team'&&<Team setPage={goPage}/>}
            {page==='settings'&&<Settings setPage={goPage}/>}
            {page==='support'&&<Support setPage={goPage}/>}
            {page==='docs'&&<Docs setPage={goPage}/>}
            {page==='notifications'&&(
              <div><TopBar title="Notifications" setPage={goPage}/><div className="pc ai" style={{maxWidth:600}}>
                {getNotifs(user?.id).map(n=>{const nic={success:'check-circle',error:'alert-circle',warning:'alert-triangle',info:'info'};const ncc={success:'var(--green)',error:'var(--red)',warning:'var(--yellow)',info:'var(--blue)'};const nbg={success:'var(--green-bg)',error:'var(--red-bg)',warning:'var(--yellow-bg)',info:'var(--blue-bg)'};return(<div key={n.id} className="card fxc mb3" style={{gap:12,alignItems:'flex-start',background:n.read?'':'var(--bg)'}}><div style={{width:34,height:34,background:nbg[n.type],borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><I n={nic[n.type]} s={15} c={ncc[n.type]}/></div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:n.read?500:700}}>{n.title}</div><div style={{fontSize:12,color:'var(--text3)',lineHeight:1.6}}>{n.body}</div><div style={{fontSize:11,color:'var(--text4)',marginTop:2}}>{n.time}</div></div></div>);})
              }</div></div>
            )}
          </div>
        </div>
      )}
    </>
  );
};

const Root=()=>(
  <AuthProvider>
    <ToastProvider>
      <App/>
    </ToastProvider>
  </AuthProvider>
);
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
